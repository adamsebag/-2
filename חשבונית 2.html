
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אדם סבג - מערכת חשבוניות</title>

<!-- Bibliothèque PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: #f1f4f8;
  color: #202c3b;
  font-family: Arial, sans-serif;
}

header {
  background: #142b45;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

header p {
  margin: 0;
  color: #d5e2ef;
}

main {
  max-width: 850px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

h2 {
  font-size: 20px;
  margin-top: 0;
}

.company {
  text-align: center;
  border-bottom: 2px solid #dce4ec;
  padding-bottom: 20px;
  margin-bottom: 20px;
}

.company h2 {
  font-size: 25px;
  margin: 5px;
  color: #142b45;
}

.company p {
  margin: 6px;
  color: #53677c;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
}

input, textarea {
  display: block;
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #cbd5df;
  border-radius: 9px;
  font-family: Arial, sans-serif;
  background: white;
}

textarea {
  min-height: 160px;
  resize: vertical;
  line-height: 1.7;
}

#signature {
  display: block;
  width: 100%;
  height: 190px;
  border: 2px dashed #9baabd;
  border-radius: 10px;
  background: white;
  touch-action: none;
  cursor: crosshair;
}

.hint {
  color: #708095;
  font-size: 13px;
  line-height: 1.6;
}

button {
  padding: 13px 18px;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px 2px;
}

.primary {
  background: #1768ad;
  color: white;
}

.whatsapp {
  background: #20b85a;
  color: white;
}

.secondary {
  background: #e7edf4;
  color: #203b58;
}

.danger {
  background: #fbe7e7;
  color: #a32626;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 18px;
}

.actions button {
  flex: 1;
}

.invoice {
  display: none;
  background: white;
  padding: 30px;
  border: 1px solid #dce3ea;
  border-radius: 10px;
  color: #202c3b;
}

.invoice h2 {
  text-align: center;
  font-size: 26px;
}

.invoice-line {
  padding: 13px 0;
  border-bottom: 1px solid #e1e6eb;
  white-space: pre-wrap;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.invoice-amount {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  margin: 30px 0;
}

.invoice-signature {
  margin-top: 30px;
}

.invoice-signature img {
  display: block;
  max-width: 300px;
  width: 100%;
  height: 100px;
  object-fit: contain;
  object-position: right center;
  border-bottom: 1px solid #777;
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  border-bottom: 1px solid #e5e9ee;
  padding: 14px 0;
}

.history-item button {
  padding: 8px 12px;
  font-size: 13px;
}

@media(max-width:550px) {
  .card { padding: 16px; }
  .invoice { padding: 17px; }
}

@media print {
  @page {
    size: A4;
    margin: 18mm;
  }

  body { background: white; }

  header,
  .form-card,
  .history-card,
  .preview-actions {
    display: none !important;
  }

  main {
    margin: 0;
    padding: 0;
    max-width: none;
  }

  #invoicePreview {
    display: block !important;
    box-shadow: none;
    border: none;
    padding: 0;
  }

  .invoice {
    display: block !important;
    border: none;
    padding: 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>אדם סבג</h1>
  <p>מערכת חשבוניות דיגיטלית</p>
</header>

<main>

<!-- FORMULAIRE -->

<section class="card form-card">

  <div class="company">
    <h2>אדם סבג</h2>
    <p><strong>עוסק פטור</strong></p>
    <p>מספר 324697150</p>
  </div>

  <h2>פרטי החשבונית</h2>

  <label>מספר חשבונית</label>
  <input id="number" placeholder="מספר חשבונית">

  <label>תאריך</label>
  <input id="date" type="date">

  <label>לכבוד</label>
  <input id="recipient" placeholder="שם המלון / הספא / הלקוח">

  <label>פרטים</label>
  <textarea
    id="details"
    placeholder="כתוב כאן את כל פרטי העבודה, השירות, האירוע, התאריכים וכל מידע נוסף..."
  ></textarea>

  <label>סכום כולל לתשלום (₪)</label>
  <input
    id="amount"
    type="number"
    min="0"
    step="0.01"
    placeholder="הכנס סכום"
  >

  <!-- SIGNATURE -->

  <div class="signature-box">

    <h2>חתימה דיגיטלית</h2>

    <p class="hint">
      חתום כאן באמצעות האצבע בטלפון או העכבר במחשב.
    </p>

    <canvas id="signature" width="1000" height="380"></canvas>

    <button class="secondary" onclick="clearSignature()">
      נקה חתימה
    </button>

  </div>

  <div class="actions">

    <button class="primary" onclick="saveInvoice()">
      שמור חשבונית
    </button>

    <button class="secondary" onclick="newInvoice()">
      חשבונית חדשה
    </button>

  </div>

  <p id="message" class="hint" aria-live="polite"></p>

</section>


<!-- INVOICE PREVIEW -->

<section class="card" id="invoicePreview">

  <div class="invoice" id="paper"></div>

  <div class="actions preview-actions">

    <button class="primary" onclick="downloadPDF()">
      הורד חשבונית PDF
    </button>

    <button class="whatsapp" onclick="sendWhatsApp()">
      שלח בוואטסאפ
    </button>

    <button class="secondary" onclick="window.print()">
      הדפס חשבונית
    </button>

  </div>

</section>


<!-- HISTORY -->

<section class="card history-card">

  <h2>חשבוניות שמורות</h2>

  <div id="history"></div>

</section>

</main>


<script>

// INITIALIZATION

const fields = [
  "number",
  "date",
  "recipient",
  "details",
  "amount"
];

const canvas = document.getElementById("signature");
const ctx = canvas.getContext("2d");

let drawing = false;
let hasSignature = false;
let editingId = null;

ctx.lineWidth = 5;
ctx.lineCap = "round";
ctx.lineJoin = "round";
ctx.strokeStyle = "#142b45";


// DATE

function today() {
  const d = new Date();
  const offset = d.getTimezoneOffset();

  return new Date(d.getTime() - offset * 60000)
    .toISOString().slice(0, 10);
}

document.getElementById("date").value = today();


// DIGITAL SIGNATURE

function getPosition(event) {

  const rect = canvas.getBoundingClientRect();

  return {
    x: (event.clientX - rect.left) * canvas.width / rect.width,
    y: (event.clientY - rect.top) * canvas.height / rect.height
  };
}

canvas.addEventListener("pointerdown", function(event) {

  event.preventDefault();

  drawing = true;
  canvas.setPointerCapture(event.pointerId);

  const p = getPosition(event);

  ctx.beginPath();
  ctx.moveTo(p.x, p.y);

});

canvas.addEventListener("pointermove", function(event) {

  if (!drawing) return;

  event.preventDefault();

  const p = getPosition(event);

  ctx.lineTo(p.x, p.y);
  ctx.stroke();

  hasSignature = true;

});

function stopDrawing() {
  drawing = false;
}

canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);
canvas.addEventListener("lostpointercapture", stopDrawing);


function clearSignature() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  hasSignature = false;

}


function getSignature() {

  if (!hasSignature) return "";

  return canvas.toDataURL("image/png");

}


function loadSignature(data) {

  clearSignature();

  if (!data) return;

  const img = new Image();

  img.onload = function() {

    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    hasSignature = true;

  };

  img.src = data;

}


// LOCAL STORAGE

function getInvoices() {

  try {

    return JSON.parse(
      localStorage.getItem("adamInvoices") || "[]"
    );

  } catch (error) {

    return [];

  }

}


function collectData() {

  const data = {};

  fields.forEach(function(id) {

    data[id] = document.getElementById(id).value.trim();

  });

  data.signature = getSignature();

  return data;

}


// SAVE INVOICE

function saveInvoice() {

  const data = collectData();

  if (!data.recipient) {
    alert("נא למלא את השדה לכבוד");
    return;
  }

  if (!data.details) {
    alert("נא למלא את הפרטים");
    return;
  }

  if (!data.amount || Number(data.amount) <= 0) {
    alert("נא להזין סכום לתשלום");
    return;
  }

  if (!data.signature) {
    alert("נא לחתום לפני שמירת החשבונית");
    return;
  }

  if (!data.number) {

    data.number = String(Date.now()).slice(-8);

    document.getElementById("number").value = data.number;

  }

  if (!data.date) {

    data.date = today();

    document.getElementById("date").value = data.date;

  }

  const invoices = getInvoices();

  const id = editingId || String(Date.now());

  const index = invoices.findIndex(function(item) {
    return item.id === id;
  });

  const invoice = {
    ...data,
    id: id
  };

  if (index >= 0) {
    invoices[index] = invoice;
  } else {
    invoices.unshift(invoice);
  }

  try {

    localStorage.setItem(
      "adamInvoices",
      JSON.stringify(invoices)
    );

  } catch (error) {

    alert("אין מספיק מקום לשמירת החשבוניות בדפדפן.");
    return;

  }

  editingId = id;

  renderInvoice(invoice);
  renderHistory();

  document.getElementById("message").textContent =
    "החשבונית נשמרה בהצלחה!";

}


// ESCAPE HTML

function escapeHTML(value) {

  return String(value || "").replace(/[&<>"']/g, function(char) {

    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char];

  });

}


// DISPLAY INVOICE

function renderInvoice(data) {

  const paper = document.getElementById("paper");

  paper.style.display = "block";

  const signatureHTML = data.signature
    ? `<img src="${data.signature}" alt="חתימה דיגיטלית">`
    : "";

  const formattedAmount =
    Number(data.amount).toLocaleString("he-IL", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  paper.innerHTML = `

    <div class="company">

      <h2>אדם סבג</h2>

      <p><strong>עוסק פטור</strong></p>

      <p>מספר 324697150</p>

    </div>

    <h2>חשבונית</h2>

    <div class="invoice-line">
      <strong>מספר חשבונית:</strong>
      ${escapeHTML(data.number)}
    </div>

    <div class="invoice-line">
      <strong>תאריך:</strong>
      ${escapeHTML(data.date)}
    </div>

    <div class="invoice-line">
      <strong>לכבוד:</strong>
      ${escapeHTML(data.recipient)}
    </div>

    <div class="invoice-line">
      <strong>פרטים:</strong>
      ${escapeHTML(data.details)}
    </div>

    <div class="invoice-amount">
      סה"כ לתשלום: ${formattedAmount} ₪
    </div>

    <div class="invoice-signature">

      <strong>חתימה:</strong>

      ${signatureHTML}

    </div>

  `;

  document.getElementById("invoicePreview").style.display = "block";

}


// HISTORY

function renderHistory() {

  const history = document.getElementById("history");

  const invoices = getInvoices();

  if (invoices.length === 0) {

    history.innerHTML =
      "<p class='hint'>אין חשבוניות שמורות עדיין.</p>";

    return;

  }

  history.innerHTML = invoices.map(function(invoice) {

    return `

      <div class="history-item">

        <div>

          <strong>חשבונית ${escapeHTML(invoice.number)}</strong>

          <div class="hint">
            ${escapeHTML(invoice.recipient)}
          </div>

          <div class="hint">
            ${escapeHTML(invoice.date)}
          </div>

          <strong>
            ${Number(invoice.amount).toLocaleString("he-IL")} ₪
          </strong>

        </div>

        <div>

          <button class="secondary"
            onclick="openInvoice('${invoice.id}')">
            פתח
          </button>

          <button class="danger"
            onclick="deleteInvoice('${invoice.id}')">
            מחק
          </button>

        </div>

      </div>

    `;

  }).join("");

}


// OPEN SAVED INVOICE

function openInvoice(id) {

  const invoice = getInvoices().find(function(item) {
    return item.id === id;
  });

  if (!invoice) return;

  fields.forEach(function(field) {

    document.getElementById(field).value =
      invoice[field] || "";

  });

  editingId = id;

  loadSignature(invoice.signature);

  renderInvoice(invoice);

  document.getElementById("message").textContent =
    "חשבונית נטענה לעריכה.";

}


// DELETE INVOICE

function deleteInvoice(id) {

  if (!confirm("למחוק את החשבונית?")) return;

  const invoices = getInvoices().filter(function(item) {
    return item.id !== id;
  });

  localStorage.setItem(
    "adamInvoices",
    JSON.stringify(invoices)
  );

  if (editingId === id) {
    newInvoice();
  }

  renderHistory();

}


// NEW INVOICE

function newInvoice() {

  fields.forEach(function(field) {

    document.getElementById(field).value = "";

  });

  document.getElementById("date").value = today();

  clearSignature();

  editingId = null;

  document.getElementById("invoicePreview").style.display = "none";

  document.getElementById("message").textContent = "";

}


// PDF GENERATION

async function createInvoicePDF() {

  const paper = document.getElementById("paper");

  if (!paper.innerHTML.trim() ||
      document.getElementById("invoicePreview").style.display === "none") {

    alert("נא לשמור חשבונית תחילה");

    return null;

  }

  if (typeof html2pdf === "undefined") {

    alert("ספריית PDF לא נטענה. בדוק את חיבור האינטרנט.");

    return null;

  }

  const number = document.getElementById("number").value || "invoice";

  const options = {

    margin: 10,

    filename: `חשבונית-${number}.pdf`,

    image: {
      type: "jpeg",
      quality: 1
    },

    html2canvas: {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff"
    },

    jsPDF: {
      unit: "mm",
      format: "a4",
      orientation: "portrait"
    }

  };

  const pdfBlob = await html2pdf()
    .set(options)
    .from(paper)
    .outputPdf("blob");

  return pdfBlob;

}


// DOWNLOAD PDF

async function downloadPDF() {

  try {

    const blob = await createInvoicePDF();

    if (!blob) return;

    const number = document.getElementById("number").value || "invoice";

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;

    link.download = `חשבונית-${number}.pdf`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 10000);

  } catch (error) {

    console.error(error);

    alert("שגיאה ביצירת PDF");

  }

}


// SHARE PDF ON WHATSAPP

async function sendWhatsApp() {

  try {

    const blob = await createInvoicePDF();

    if (!blob) return;

    const number = document.getElementById("number").value || "invoice";

    const file = new File(
      [blob],
      `חשבונית-${number}.pdf`,
      { type: "application/pdf" }
    );

    const message =
      `שלום, מצורפת חשבונית מספר ${number} מאדם סבג. תודה!`;

    // Direct file sharing when supported

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {

      await navigator.share({

        files: [file],

        title: "חשבונית אדם סבג",

        text: message

      });

    } else {

      // Fallback: download PDF and open WhatsApp

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      link.href = url;

      link.download = `חשבונית-${number}.pdf`;

      document.body.appendChild(link);

      link.click();

      link.remove();

      setTimeout(function() {
        URL.revokeObjectURL(url);
      }, 10000);

      window.open(
        "https://wa.me/?text=" + encodeURIComponent(message),
        "_blank"
      );

      alert("החשבונית הורדה. יש לצרף אותה בוואטסאפ.");

    }

  } catch (error) {

    if (error.name !== "AbortError") {

      console.error(error);

      alert("שגיאה בשליחת החשבונית");

    }

  }

}


// START APPLICATION

renderHistory();

</script>

</body>
</html>
